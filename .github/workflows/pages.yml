name: Test and deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: App tests (see jest.ci.config.js)
        run: npm run test:ci

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for Pages
        run: npm run build:pages
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Playwright
        # No --with-deps: it installs system packages with apt, which failed the job when
        # Ubuntu's mirrors could not be resolved. The runner's own Chrome is used (E2E_CHANNEL);
        # Playwright's Chromium is downloaded as a fallback, with retries.
        run: |
          pip install playwright==1.63.0
          for attempt in 1 2 3; do
            python -m playwright install chromium && break
            echo "download failed (attempt $attempt), retrying in 20 s"; sleep 20
          done || true
      - name: Every feature, in a real browser (e2e/smoke.py)
        env:
          E2E_CHANNEL: chrome
        run: python e2e/smoke.py

  build:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for a sub path (https://<user>.github.io/<repo>/)
        run: npm run build:pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
